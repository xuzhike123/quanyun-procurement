schema_version: 1
bundle_id: bundle.quanyun-procurement
book:
  title: 泉运集团非工程类采购与"三重一大"决策制度汇编
  author: 福建省泉运实业集团有限公司（综合部、党群部）；上位制度为泉州交通发展集团有限责任公司
  source_pack: books/quanyun-procurement
  baseline_tag: baseline-quanyun-proc-9cap-20261028
entry:
  name: quanyun-procurement
  description: '当用户要判断泉运集团（福建省泉运实业集团有限公司）及其权属企业的采购该怎么走流程、该谁批、该用哪种采购方式，或者要判断某事项属于党委会/董事会/总经理办公会哪一主体决策时调用。覆盖：制度射程与归口部室、金额分档与审批链（1万/20万/50万/200万/500万/1000万/2000万）、公开招标与邀请招标及单一来源例外、流标二次招标、零星小额月度归集与应急采购补手续、内部采购定价标准、台账备案与季度年度报送、三重一大议事主体归属与六步决策程序、廉洁红线与责任追究。不适用于工程建设项目招投标、法律意见与审计结论出具。Triggers: 泉运集团/交发集团/采购审批/采购方式/限额以上/限额以下/零星小额/内部采购/三重一大/党委前置研究/董事会审议/总经理办公会/归口部室/采购会签单/阳光采购平台'
  core_principles:
  - 先判射程再谈流程。工程建设项目、使用工会经费等非行政支出的限额以下采购、商业流通与品牌代理采购都不在这套办法的射程内，射程判错后面每一步都错。
  - 金额是唯一硬开关。先算单项或批量估算价，再按 20 万、50 万、200 万三个台阶决定走会签单、采购领导小组会还是报上级审批。
  - 审批权不下放。限额以下采购统一由泉运集团审批，权属企业没有审批决策权；限额以上统一由交发集团审批。
  - 归口决定谁签字。先按采购标的找到归口管理部室，再谈流程，否则会签单无人可批。
  - 决策与执行分离。需求、询价、定价、采购、验收、结算必须分岗分设，任何一人到底的安排都不合规。
  - 三重一大看事项类型而非金额。同一笔支出归党委会、董事会还是总经理办公会，由事项性质决定；党委会只做前置研究，不做前置决定。
  - 留痕即合规。会议纪要、会签单、台账、备案表、验收单缺一项，事后追责时企业无法自证。
  - 联合会审是挂网前的集团级最后一关。依法必须招标的工程项目，以及非工程类、工程服务类 200 万元（含）以上的项目，招标文件须在权属企业完成内部三重一大决策、将文件及决策材料报送交发集团后，经联合会审并签订确认表，方可挂网；权属企业自身决策不替代该集团会审。
  - 50 万元以上采购按董事会口径。60号办法第二十二条（二）1 末句把采购项目的金额判断权转致给三重一大办法；78号办法第六条 1（4）把 50 万元（不含）以上的单项或批量大宗物资采购及购买服务及其采购方式的确定列为董事会审议事项。该区间审批链程序仍须履行，但治理主体按董事会把握，两套会议并存留痕。
  - 先填后答，未填齐不出结论。调用后先执行信息采集门禁：必写 6 项（采购主体、采购标的、估算价及计价口径、预算状态、是否属工程、资金来源与射程例外）与命中的场景补写项未齐备前，只输出采集表，不给任何流程、档位、主体、方式或条文结论；纯术语解释与整书概览类问题豁免。清单见 book/intake-checklist.md。
  out_of_scope:
  - 工程建设项目招投标，包括工程施工以及与工程建设有关的货物和服务，按工程管理制度执行。
  - 出具法律意见书、审计结论、税务处理方案。
  - 代替企业作出实际决策，或代替审批人签署文件。
  - 判断某供应商报价是否合理，此类判断需要市场行情数据支撑。
  stop_conditions:
  - 调用前置门禁未通过时不得输出任何判定结论；必写 6 项与命中的场景补写项见 book/intake-checklist.md，缺项时只输出「信息采集表」，纯术语与整书概览类问题豁免。
  - 50 万元（不含）以上大宗物资采购及购买服务，依 60号第二十二条转致条款与 78号第六条按董事会口径直接给出治理主体，无需判停；集团后续解释口径或权属企业备案制度更严时以新口径或更严者为准并注明依据。其余真正的条文冲突、附件2 与正文的版本漂移，仍须停下核对。
  - 采购金额、采购类型或是否预算内无法确定时，先索要数据，不猜测档位。
  - 涉及具体人员的责任认定、纪律处分定性，只提供制度依据，不作定性结论。
